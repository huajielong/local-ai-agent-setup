# Copy this file to .github/workflows/codereview.yml in the repository you
# want reviewed. It checks out the private agent repo and runs the CLI.
#
# Repository secrets required:
#   OPENAI_API_KEY
#   OPENAI_BASE_URL
#   OPENAI_MODEL
# The agent repo is public, so no cross-repo token is needed.
# Optional (only when REVIEW_CONTEXT_ENABLED=true):
#   COHERE_API_KEY
#   COHERE_EMBED_MODEL
name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout agent source
        uses: actions/checkout@v4
        with:
          repository: huajielong/codereview-agent
          path: .codereview

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .codereview/requirements.txt

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .codereview/requirements.txt
          python -m pip install -e .codereview

      - name: Review PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: "16384"
          # Uncomment both lines to enable cross-file context retrieval.
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_EMBED_MODEL: ${{ secrets.COHERE_EMBED_MODEL }}
          REVIEW_DRY_RUN: "false"
          REVIEW_CONTEXT_ENABLED: "true"
          REVIEW_POLICY_ENABLED: "true"
          REVIEW_POLICY_PATH: ".codereview/policies/security.json"
          REVIEW_PROMPT_DIR: ".codereview/prompts"
          DATABASE_PATH: "data/codereview.db"
          CHROMA_PATH: "data/chroma"
          CACHE_DIR: "data/cache"
          REVIEW_AUDIT_PATH: "data/audit.jsonl"
        run: |
          python -I -X utf8 -m codereview.cli \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --mode security \
            --post
